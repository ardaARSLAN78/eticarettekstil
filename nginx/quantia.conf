# Konteyner güncellemelerinde değişen IP'ler Docker DNS üzerinden yeniden çözülür.
resolver 127.0.0.11 valid=5s ipv6=off;
upstream quantia_backend {
    zone quantia_backend 64k;
    server backend:4000 resolve;
}
upstream quantia_frontend {
    zone quantia_frontend 64k;
    server frontend:3000 resolve;
}
server {
    listen 80;
    server_name _;

    client_max_body_size 128k;
    client_header_timeout 10s;
    client_body_timeout 15s;
    send_timeout 30s;

    # Gerçek istemci IP'si yalnızca bu güvenilir ters vekilden alınır.
    location = /api/graphql {
        proxy_pass http://quantia_backend/graphql;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }

    location /payments/ {
        proxy_pass http://quantia_backend;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 30s;
    }

    location = /api/media {
        client_max_body_size 9m;
        proxy_pass http://quantia_backend/admin/media;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 30s;
    }

    location /media/uploads/ {
        proxy_pass http://quantia_backend/uploads/;
        proxy_set_header Host $host;
        proxy_read_timeout 30s;
    }

    location / {
        proxy_pass http://quantia_frontend;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_http_version 1.1;
        proxy_read_timeout 30s;
    }
}
