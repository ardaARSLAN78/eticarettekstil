# Mevcut mağaza verilerinden ayrı quantia_test veritabanına bağlanan kabul ortamı.
services:
  backend-e2e:
    profiles: ["qa"]
    image: quantia-backend:latest
    env_file: backend/.env
    environment:
      NODE_ENV: test
      HOST: 0.0.0.0
      PORT: 4000
      WEB_ORIGIN: http://localhost:3200
      PUBLIC_API_URL: http://localhost:4200
      DATABASE_URL: postgresql://${POSTGRES_USER:-quantia}:${POSTGRES_PASSWORD:-quantia_local_only}@postgres:5432/quantia_test
      REDIS_URL: redis://redis:6379/1
      ENCRYPTION_KEY: aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
      ENABLE_DEMO_PAYMENT: "true"
    volumes:
      - qa_media_data:/app/backend/tmp/test-uploads
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
    init: true
  frontend-e2e:
    profiles: ["qa"]
    image: quantia-frontend:latest
    environment:
      APP_ORIGIN: http://localhost:3200
      API_INTERNAL_URL: http://backend-e2e:4000
    ports: ["127.0.0.1:3200:3000"]
    depends_on:
      backend-e2e: { condition: service_healthy }
    init: true
volumes:
  qa_media_data:
